name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: true

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    # The same image as docker-compose.yml. The e2e tests create and migrate
    # sastrane_test themselves.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: sastrane
          POSTGRES_PASSWORD: sastrane
          POSTGRES_DB: sastrane
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sastrane -d sastrane"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
    env:
      DATABASE_URL: postgresql://sastrane:sastrane@localhost:5432/sastrane
      TEST_DATABASE_URL: postgresql://sastrane:sastrane@localhost:5432/sastrane_test
      JWT_SECRET: ci-only-secret-not-used-outside-tests
      JWT_EXPIRES_IN: 15m
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Apply migrations
        run: npx prisma migrate deploy

      # Fails when schema.prisma changed without a migration.
      - name: Check that the migrations match the schema
        run: npx prisma migrate diff --from-config-datasource --to-schema prisma/schema.prisma --exit-code

      - name: Seed demo data
        run: npx prisma db seed

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run typecheck

      - name: Test
        run: npm test -- --runInBand

      - name: End-to-end test
        run: npm run test:e2e -- --runInBand

      - name: Build
        run: npm run build

      # Fails when a controller or DTO changed without npm run openapi.
      - name: Check that openapi.json matches the code
        run: node dist/openapi/generate.js && git diff --exit-code -- openapi.json

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    env:
      NEXT_TELEMETRY_DISABLED: 1
      BACKEND_URL: http://localhost:4000
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      # Fails when openapi.json changed without npm run api:types.
      - name: Check that the API types match openapi.json
        run: npm run api:types -- --check

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: End-to-end test
        run: npm run test:e2e

      - name: Build
        run: npm run build
