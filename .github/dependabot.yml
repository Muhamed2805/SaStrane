version: 2

updates:
  - package-ecosystem: npm
    directory: /backend
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Sarajevo
    open-pull-requests-limit: 5
    ignore:
      # The types must match the Node version in .nvmrc. Raise this limit
      # together with .nvmrc.
      - dependency-name: "@types/node"
        versions: [">=25"]
    groups:
      # The client, the CLI and the adapter must move together, majors too.
      prisma:
        patterns: ["prisma", "@prisma/*"]
      production-dependencies:
        dependency-type: production
        update-types: [minor, patch]
      development-dependencies:
        dependency-type: development
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
      day: monday
      time: "06:15"
      timezone: Europe/Sarajevo
    open-pull-requests-limit: 5
    ignore:
      # The types must match the Node version in .nvmrc. Raise this limit
      # together with .nvmrc.
      - dependency-name: "@types/node"
        versions: [">=25"]
    groups:
      production-dependencies:
        dependency-type: production
        update-types: [minor, patch]
      development-dependencies:
        dependency-type: development
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:30"
      timezone: Europe/Sarajevo
    open-pull-requests-limit: 3
