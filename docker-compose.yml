# Local PostgreSQL for development and the backend end-to-end tests, and
# SeaweedFS as the S3 storage for job photos.
#
#   docker compose up -d     start both in the background
#   docker compose down      stop them and keep the data
#   docker compose down -v   stop them and delete the data
#
# The ports are published on 127.0.0.1 only, so the fixed passwords are never
# reachable from the network. Set POSTGRES_PORT or STORAGE_PORT when 5432 or
# 8333 is taken.
name: sastrane

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: sastrane
      POSTGRES_PASSWORD: sastrane
      POSTGRES_DB: sastrane
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sastrane -d sastrane"]
      interval: 2s
      timeout: 5s
      retries: 15

  # S3 API on port 8333. docker/seaweedfs/s3.json holds the backend's key
  # and lets anyone read the photos bucket, as a public bucket does in
  # production. Create the bucket once with `npm run storage:init` in
  # backend/.
  storage:
    image: chrislusf/seaweedfs:4.48
    command: >-
      server -dir=/data -master.volumeSizeLimitMB=1024
      -s3 -s3.config=/etc/seaweedfs/s3.json
    ports:
      - "127.0.0.1:${STORAGE_PORT:-8333}:8333"
    volumes:
      - storage-data:/data
      - ./docker/seaweedfs/s3.json:/etc/seaweedfs/s3.json:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8333/healthz"]
      interval: 2s
      timeout: 5s
      retries: 30

volumes:
  db-data:
  storage-data:
