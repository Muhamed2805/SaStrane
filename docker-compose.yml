# Local PostgreSQL for development and the backend end-to-end tests.
#
#   docker compose up -d     start it in the background
#   docker compose down      stop it and keep the data
#   docker compose down -v   stop it and delete the data
#
# The port is published on 127.0.0.1 only, so the fixed password is never
# reachable from the network. Set POSTGRES_PORT when 5432 is taken.
name: sastrane

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: sastrane
      POSTGRES_PASSWORD: sastrane
      POSTGRES_DB: sastrane
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sastrane -d sastrane"]
      interval: 2s
      timeout: 5s
      retries: 15

volumes:
  db-data:
